[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-waf"
version = "2.10.0"
description = "Self-hosted request filtering, bot management, and WAF middleware for Django — rate limiting, UA anomaly scoring, JS challenges, nginx blocklist generation, and collective threat feed."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Nigel Copley"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = [
    "django",
    "waf",
    "bot-detection",
    "rate-limiting",
    "security",
    "firewall",
]
dependencies = [
    "Django>=5.2",
    "django-redis>=5.4",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/icvoss/django-waf"
Documentation = "https://github.com/icvoss/django-waf"
Changelog = "https://github.com/icvoss/django-waf/blob/main/CHANGELOG.md"
"Issue Tracker" = "https://github.com/icvoss/django-waf/issues"
"Source Code" = "https://github.com/icvoss/django-waf"

[project.optional-dependencies]
api = ["djangorestframework>=3.14"]
celery = ["celery>=5.3", "django-celery-beat>=2.6"]
geoip = ["geoip2>=4.8"]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "fakeredis>=2.20",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "django-stubs>=5.0",
    "djangorestframework>=3.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
django_waf = ["py.typed", "templates/**/*.html", "conf/nginx/*.conf.example"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
markers = [
    "redis_integration: requires a real Redis server (selected by the dedicated CI leg via --ds=settings_redis; skipped by the default LocMemCache/fakeredis run).",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101", "S104", "S105", "S106", "S107", "S311", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# Django autogenerates migrations; verbose_name / help_text strings
# frequently exceed the 120-char line limit. Migrations are not
# hand-edited, so lint rules for them are relaxed.
"src/django_waf/migrations/*.py" = ["E501"]
# Pytest fixtures imported from django_waf.testing.fixtures are used as
# test-function parameters of the same name, the standard pytest fixture
# pattern, which ruff's F811 misreads as shadowing/redefinition.
"tests/test_testing_fixtures.py" = ["F811"]
"tests/test_redis_fallback.py" = ["F811"]
"tests/test_flush_rule_hit_counts.py" = ["F811"]
"tests/test_flush_probe.py" = ["F811"]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main"]
strict = false

# These third-party packages ship no type stubs and no py.typed marker, so
# mypy cannot analyse their public interfaces. This suppresses noise about
# THEIR missing types, not ours: it does not affect how mypy checks imports
# from our own modules or from packages that do ship types.
[[tool.mypy.overrides]]
module = ["rest_framework.*", "celery.*", "django_redis.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*", "*/testing/*"]

[tool.coverage.report]
fail_under = 90
